name: Deploy Cloudflare MVP

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: proqtrack-cloudflare-production
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: production
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      PROQTRACK_BASE_URL: https://proqtrack.arywibowo.workers.dev
      PROQTRACK_HEALTH_URL: https://proqtrack.arywibowo.workers.dev/api/health
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Verify required secrets
        shell: bash
        run: |
          test -n "$CLOUDFLARE_API_TOKEN" || { echo "::error::CLOUDFLARE_API_TOKEN is missing"; exit 1; }
          test -n "$CLOUDFLARE_ACCOUNT_ID" || { echo "::error::CLOUDFLARE_ACCOUNT_ID is missing"; exit 1; }

      - run: npm ci
      - name: Dependency security gate
        run: npm audit --audit-level=critical
      - run: npm test
      - run: npm run build

      - name: Ensure Worker API_AUTH_SECRET
        shell: bash
        run: |
          set -euo pipefail
          npx wrangler whoami
          list_json="$(npx wrangler secret list --env="" --format json 2>/dev/null | node -e '
            const raw = require("fs").readFileSync(0, "utf8");
            const start = raw.indexOf("[");
            process.stdout.write(start >= 0 ? raw.slice(start) : "[]");
          ')"
          if node -e '
            const list = JSON.parse(process.argv[1] || "[]");
            const names = (Array.isArray(list) ? list : []).map((x) => x.name || x);
            process.exit(names.includes("API_AUTH_SECRET") ? 0 : 1);
          ' "$list_json"; then
            echo "API_AUTH_SECRET already present — not rotating"
          else
            echo "API_AUTH_SECRET missing — generating and storing (value not logged)"
            openssl rand -base64 48 | tr -d '\n' | npx wrangler secret put API_AUTH_SECRET --env=""
          fi

      - name: Record pre-deploy D1 Time Travel bookmark
        id: recovery
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p recovery
          bookmark="recovery/proqtrack-predeploy-${GITHUB_SHA}.json"
          npx wrangler d1 time-travel info proqtrack-mvp --json > "$bookmark"
          test -s "$bookmark"
          echo "path=$bookmark" >> "$GITHUB_OUTPUT"

      - name: Upload pre-deploy recovery metadata
        uses: actions/upload-artifact@v4
        with:
          name: proqtrack-predeploy-recovery-${{ github.sha }}
          path: ${{ steps.recovery.outputs.path }}
          retention-days: 30
          if-no-files-found: error

      - name: Apply D1 migrations before deploy
        run: npx wrangler d1 migrations apply DB --remote --env=""

      - name: Verify M7 MKB tenant seed
        shell: bash
        run: |
          set -euo pipefail
          result="$(npx wrangler d1 execute DB --remote --env="" --json --command "SELECT (SELECT COUNT(*) FROM core_organizations WHERE id='ORG-MKB' AND code='MKB' AND name='Mitra Kreasi Bersama' AND status='active') AS organizations, (SELECT COUNT(*) FROM core_clients WHERE organization_id='ORG-MKB' AND id='CL-MKB-FMCG-UAT' AND status='active') AS clients, (SELECT COUNT(*) FROM core_projects WHERE organization_id='ORG-MKB' AND id='PRJ-MKB-SALES-UAT' AND status='active') AS projects, (SELECT COUNT(*) FROM core_outlets WHERE organization_id='ORG-MKB' AND status='active') AS outlets, (SELECT COUNT(*) FROM core_products WHERE organization_id='ORG-MKB' AND status='active') AS products, (SELECT COUNT(*) FROM core_employees WHERE organization_id='ORG-MKB' AND employment_status='active') AS employees, (SELECT COUNT(*) FROM core_survey_templates WHERE organization_id='ORG-MKB' AND id='SURV-MKB-PERFECT-STORE' AND status='active') AS surveys, (SELECT COUNT(*) FROM core_sync_state WHERE organization_id='ORG-MKB' AND cutover_mode='cloud') AS cloud_cutover, (SELECT COUNT(*) FROM core_organization_users WHERE organization_id='ORG-MKB' AND status='active') AS linked_users;")"
          printf '%s' "$result" | node -e '
            const raw = require("fs").readFileSync(0, "utf8");
            const start = raw.indexOf("[");
            if (start < 0) throw new Error("D1 JSON result not found");
            const parsed = JSON.parse(raw.slice(start));
            const entry = Array.isArray(parsed) ? parsed.find(x => Array.isArray(x?.results)) : parsed;
            const row = entry?.results?.[0];
            if (!row) throw new Error("MKB readiness row missing");
            const expected = { organizations:1, clients:1, projects:1, outlets:6, products:5, employees:5, surveys:1, cloud_cutover:1 };
            for (const [key, value] of Object.entries(expected)) {
              if (Number(row[key]) !== value) throw new Error(`MKB seed mismatch ${key}: expected ${value}, got ${row[key]}`);
            }
            console.log(`M7 MKB seed PASS: outlets=${row.outlets} products=${row.products} employees=${row.employees} linkedUsers=${row.linked_users}`);
          '

      - name: Diagnose M7 MKB identity readiness
        shell: bash
        run: |
          set -euo pipefail
          result="$(npx wrangler d1 execute DB --remote --env="" --json --command "
            WITH target(email, expected_role, employee_id) AS (
              VALUES
                ('budi.santoso@proqtrack.id','employee','EMP-MKB-BUDI'),
                ('nadia.permata@proqtrack.id','employee','EMP-MKB-NADIA'),
                ('rizky.pratama@proqtrack.id','supervisor','EMP-MKB-RIZKY'),
                ('manager-re@proqtrack.id','manager','EMP-MKB-MANAGER'),
                ('head@proqtrack.id','head','EMP-MKB-HEAD')
            )
            SELECT
              t.email,
              t.expected_role,
              CASE WHEN au.id IS NULL THEN 'missing' ELSE au.status END AS auth_status,
              COALESCE(ou.role,'missing') AS org_role,
              COALESCE(ou.status,'missing') AS org_status,
              CASE WHEN e.auth_user_id=au.id AND au.id IS NOT NULL THEN 1 ELSE 0 END AS employee_linked,
              CASE
                WHEN t.expected_role='head' THEN 1
                WHEN EXISTS (
                  SELECT 1 FROM core_project_memberships pm
                  WHERE pm.organization_id='ORG-MKB'
                    AND pm.project_id='PRJ-MKB-SALES-UAT'
                    AND pm.user_id=au.id
                    AND pm.status='active'
                ) THEN 1 ELSE 0
              END AS project_linked
            FROM target t
            LEFT JOIN auth_users au ON lower(au.email)=lower(t.email)
            LEFT JOIN core_organization_users ou
              ON ou.organization_id='ORG-MKB' AND ou.user_id=au.id
            LEFT JOIN core_employees e
              ON e.organization_id='ORG-MKB' AND e.id=t.employee_id
            ORDER BY t.email;
          ")"
          printf '%s' "$result" | node -e '
            const raw = require("fs").readFileSync(0, "utf8");
            const start = raw.indexOf("[");
            if (start < 0) throw new Error("D1 JSON result not found");
            const parsed = JSON.parse(raw.slice(start));
            const entry = Array.isArray(parsed) ? parsed.find(x => Array.isArray(x?.results)) : parsed;
            const rows = entry?.results || [];
            console.log("M7 MKB identity readiness:");
            for (const row of rows) {
              console.log([
                row.email,
                "auth=" + row.auth_status,
                "orgRole=" + row.org_role,
                "orgStatus=" + row.org_status,
                "employeeLinked=" + row.employee_linked,
                "projectLinked=" + row.project_linked
              ].join(" | "));
            }
            const provisioned = rows.filter(row =>
              row.auth_status !== "missing"
              && row.org_role === row.expected_role
              && Number(row.employee_linked) === 1
            ).length;
            const ready = rows.filter(row =>
              row.auth_status === "active"
              && row.org_status === "active"
              && row.org_role === row.expected_role
              && Number(row.employee_linked) === 1
              && Number(row.project_linked) === 1
            ).length;
            console.log("M7 MKB identity provisioned=" + provisioned + "/5");
            console.log("M7 MKB human login ready=" + ready + "/5");
          '

      - name: Record D1 database id
        shell: bash
        run: |
          set -euo pipefail
          info="$(npx wrangler d1 info proqtrack-mvp --json 2>/dev/null || true)"
          node -e '
            const raw = process.argv[1] || "";
            const start = raw.indexOf("{");
            if (start < 0) { console.log("D1 info unavailable"); process.exit(0); }
            const j = JSON.parse(raw.slice(start));
            const id = j.uuid || j.id || j.database_id || "";
            console.log(id ? ("D1 database_id=" + id) : "D1 database_id missing from info payload");
          ' "$info"

      - name: Deploy Worker after migration
        run: npx wrangler deploy --env=""

      - name: Verify live API health
        shell: bash
        run: |
          set -euo pipefail
          body="$(curl --fail --silent --show-error --retry 5 --retry-delay 2 --retry-all-errors "$PROQTRACK_HEALTH_URL")"
          printf '%s' "$body" | node -e '
            const raw = require("fs").readFileSync(0, "utf8");
            const data = JSON.parse(raw);
            if (data.ok !== true || data.service !== "ProQTrack" || data.milestone !== "M7") {
              console.error("Health check failed", data);
              process.exit(1);
            }
            if (data.dependencies?.d1 !== true || data.dependencies?.hardeningSchema !== true || data.dependencies?.reportingSchema !== true || data.dependencies?.uatSchema !== true) {
              console.error("M7 dependency check failed", data.dependencies);
              process.exit(1);
            }
            console.log(`Health check PASS: service=${data.service} environment=${data.environment || "unknown"} milestone=${data.milestone}`);
          '

      - name: Run authenticated M7 production UAT
        shell: bash
        run: bash scripts/m7-authenticated-production-uat.sh

      - name: Verify security headers and auth boundaries
        shell: bash
        run: |
          set -euo pipefail
          api_headers="$(curl --silent --show-error --retry 3 --dump-header - --output /dev/null "$PROQTRACK_HEALTH_URL" | tr -d '\r')"
          printf '%s\n' "$api_headers" | grep -qi '^x-content-type-options: nosniff$'
          printf '%s\n' "$api_headers" | grep -qi '^x-frame-options: DENY$'
          printf '%s\n' "$api_headers" | grep -qi '^strict-transport-security:'
          printf '%s\n' "$api_headers" | grep -qi '^x-request-id:'
          printf '%s\n' "$api_headers" | grep -qi '^content-security-policy:'
          ! printf '%s\n' "$api_headers" | grep -qi '^content-security-policy-report-only:'

          static_headers="$(curl --silent --show-error --retry 3 --dump-header - --output /dev/null "$PROQTRACK_BASE_URL/" | tr -d '\r')"
          printf '%s\n' "$static_headers" | grep -qi '^x-content-type-options: nosniff$'
          printf '%s\n' "$static_headers" | grep -qi '^x-frame-options: DENY$'
          printf '%s\n' "$static_headers" | grep -qi '^content-security-policy:'
          ! printf '%s\n' "$static_headers" | grep -qi '^content-security-policy-report-only:'

          evidence_status="$(curl --silent --show-error --output /tmp/evidence-body --write-out '%{http_code}' "$PROQTRACK_BASE_URL/api/evidence")"
          test "$evidence_status" = "401" || { echo "::error::Unauthenticated evidence endpoint returned HTTP $evidence_status"; cat /tmp/evidence-body; exit 1; }

          for path in /api/monitoring/summary /api/reports /api/workflows /api/analytics/overview /api/query/visits /api/bulk/employees/preview /api/admin/accounts /api/admin/organizations; do
            status="$(curl --silent --show-error --output /tmp/auth-boundary-body --write-out '%{http_code}' "$PROQTRACK_BASE_URL$path")"
            test "$status" = "401" || { echo "::error::Unauthenticated $path returned HTTP $status"; cat /tmp/auth-boundary-body; exit 1; }
          done

          echo "Security and M7 auth-boundary smoke checks PASS"
