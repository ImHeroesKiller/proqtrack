name: Deploy Cloudflare MVP

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: proqtrack-cloudflare-production
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: production
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Verify required secrets
        shell: bash
        run: |
          test -n "$CLOUDFLARE_API_TOKEN" || { echo "::error::CLOUDFLARE_API_TOKEN is missing"; exit 1; }
          test -n "$CLOUDFLARE_ACCOUNT_ID" || { echo "::error::CLOUDFLARE_ACCOUNT_ID is missing"; exit 1; }

      - run: npm ci
      - run: npm run build

      - name: Provision bindings and deploy
        run: npx wrangler deploy

      - name: Apply D1 migrations
        run: npx wrangler d1 migrations apply DB --remote

      - name: Redeploy after migration
        run: npx wrangler deploy

      - name: Verify API
        shell: bash
        run: |
          URL="$(node -e "const fs=require('fs');const p='.wrangler/deploy/config.json';if(fs.existsSync(p)){const j=JSON.parse(fs.readFileSync(p));console.log(j.url||'')}" 2>/dev/null || true)"
          echo "Deployment completed. Health endpoint: ${URL:-see Cloudflare dashboard}/api/health"
