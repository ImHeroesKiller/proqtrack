name: Deploy Cloudflare MVP

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: proqtrack-cloudflare-production
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: production
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Verify required secrets
        shell: bash
        run: |
          test -n "$CLOUDFLARE_API_TOKEN" || { echo "::error::CLOUDFLARE_API_TOKEN is missing"; exit 1; }
          test -n "$CLOUDFLARE_ACCOUNT_ID" || { echo "::error::CLOUDFLARE_ACCOUNT_ID is missing"; exit 1; }

      - run: npm ci
      - run: npm test
      - run: npm run build

      - name: Provision bindings and deploy
        run: npx wrangler deploy

      - name: Ensure Worker API_AUTH_SECRET
        shell: bash
        run: |
          set -euo pipefail
          npx wrangler whoami
          list_json="$(npx wrangler secret list --format json 2>/dev/null | node -e '
            const raw = require("fs").readFileSync(0, "utf8");
            const start = raw.indexOf("[");
            process.stdout.write(start >= 0 ? raw.slice(start) : "[]");
          ')"
          if node -e '
            const list = JSON.parse(process.argv[1] || "[]");
            const names = (Array.isArray(list) ? list : []).map((x) => x.name || x);
            process.exit(names.includes("API_AUTH_SECRET") ? 0 : 1);
          ' "$list_json"; then
            echo "API_AUTH_SECRET already present — not rotating"
          else
            echo "API_AUTH_SECRET missing — generating and storing (value not logged)"
            openssl rand -base64 48 | tr -d '\n' | npx wrangler secret put API_AUTH_SECRET
          fi

      - name: Apply D1 migrations
        run: npx wrangler d1 migrations apply DB --remote

      - name: Record D1 database id
        shell: bash
        run: |
          set -euo pipefail
          info="$(npx wrangler d1 info proqtrack-mvp --json 2>/dev/null || true)"
          node -e '
            const raw = process.argv[1] || "";
            const start = raw.indexOf("{");
            if (start < 0) { console.log("D1 info unavailable"); process.exit(0); }
            const j = JSON.parse(raw.slice(start));
            const id = j.uuid || j.id || j.database_id || "";
            console.log(id ? ("D1 database_id=" + id) : "D1 database_id missing from info payload");
          ' "$info"

      - name: Redeploy after migration
        run: npx wrangler deploy

      - name: Verify API
        shell: bash
        run: |
          URL="$(node -e "const fs=require('fs');const p='.wrangler/deploy/config.json';if(fs.existsSync(p)){const j=JSON.parse(fs.readFileSync(p));console.log(j.url||'')}" 2>/dev/null || true)"
          echo "Deployment completed. Health endpoint: ${URL:-see Cloudflare dashboard}/api/health"
