name: Verify ProQTrack D1 Recovery

on:
  schedule:
    - cron: '17 2 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: proqtrack-d1-recovery
  cancel-in-progress: false

jobs:
  recovery-check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: production
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Verify Cloudflare credentials
        shell: bash
        run: |
          test -n "$CLOUDFLARE_API_TOKEN" || { echo "::error::CLOUDFLARE_API_TOKEN is missing"; exit 1; }
          test -n "$CLOUDFLARE_ACCOUNT_ID" || { echo "::error::CLOUDFLARE_ACCOUNT_ID is missing"; exit 1; }
      - name: Capture current D1 Time Travel bookmark
        id: recovery
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p recovery
          stamp="$(date -u +'%Y%m%dT%H%M%SZ')"
          bookmark="recovery/proqtrack-d1-bookmark-${stamp}.json"
          npx wrangler d1 time-travel info proqtrack-mvp --json > "$bookmark"
          test -s "$bookmark"
          echo "path=$bookmark" >> "$GITHUB_OUTPUT"
      - name: Upload non-sensitive recovery metadata
        uses: actions/upload-artifact@v7
        with:
          name: proqtrack-d1-recovery-${{ github.run_id }}
          path: ${{ steps.recovery.outputs.path }}
          retention-days: 30
          if-no-files-found: error
