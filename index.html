<style>
  @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap');

  :root {
    --blue-50:#fff7ed; --blue-100:#ffedd5; --blue-200:#fed7aa; --blue-300:#fdba74; --blue-500:#f97316; --blue-600:#ea580c; --blue-700:#c2410c;
    --green-50:#ecfdf5; --green-500:#10b981; --green-600:#059669;
    --amber-50:#fffbeb; --amber-500:#f59e0b;
    --red-50:#fef2f2; --red-500:#ef4444;
    --purple-50:#f5f3ff; --purple-700:#7c3aed;
    --gray-50:#f9fafb; --gray-100:#f3f4f6; --gray-200:#e5e7eb; --gray-300:#d1d5db;
    --gray-400:#9ca3af; --gray-500:#6b7280; --gray-600:#4b5563; --gray-700:#374151;
    --gray-800:#1f2937; --gray-900:#111827;
    --emerald-100:#d1fae5; --emerald-700:#047857;
    --amber-100:#fef3c7; --amber-700:#b45309;
    --red-100:#fee2e2; --red-700:#b91c1c;
  }

  * { box-sizing: border-box; }
  html { color-scheme: light; }
  body {
    margin: 0; padding: 0; text-align: left;
    font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
    background: var(--gray-50);
    color: var(--gray-800);
    -webkit-font-smoothing: antialiased;
  }

  #app { min-height: 100vh; }

  /* ===== Login ===== */
  .login-page {
    min-height: 100vh; display: flex; align-items: center; justify-content: center;
    background: linear-gradient(135deg, #7c2d12 0%, #ea580c 50%, #f97316 100%);
    padding: 20px;
  }
  .login-card {
    background: white; border-radius: 20px; padding: 40px;
    max-width: 400px; width: 100%; text-align: center;
    box-shadow: 0 20px 60px rgba(0,0,0,0.3);
  }
  .login-logo {
    width: 64px; height: 64px; border-radius: 16px; margin: 0 auto 16px;
    background: linear-gradient(135deg, #ea580c, #c2410c);
    color: white; font-size: 28px; font-weight: 800;
    display: flex; align-items: center; justify-content: center;
  }
  .login-card h1 { margin: 0 0 4px; font-size: 24px; font-weight: 800; color: var(--gray-900); letter-spacing: -0.5px; }
  .login-card .subtitle { font-size: 13px; color: var(--gray-400); margin-bottom: 28px; }

  /* ===== Forms ===== */
  .form-group { margin-bottom: 16px; }
  .form-row { display: flex; gap: 12px; }
  .form-row > .form-group { flex: 1; }
  .label { display: block; font-size: 13px; font-weight: 600; color: var(--gray-700); margin-bottom: 6px; }
  .input, .select, .textarea {
    width: 100%; padding: 10px 12px; border: 1px solid var(--gray-200);
    border-radius: 10px; font-size: 14px; font-family: inherit;
    background: white; color: var(--gray-800); transition: border-color .15s, box-shadow .15s;
  }
  .input:focus, .select:focus, .textarea:focus {
    outline: none; border-color: var(--blue-600); box-shadow: 0 0 0 3px var(--blue-100);
  }
  .textarea { min-height: 80px; resize: vertical; }

  /* ===== Buttons ===== */
  .btn {
    display: inline-flex; align-items: center; gap: 6px; padding: 10px 16px;
    border-radius: 10px; font-size: 14px; font-weight: 600; cursor: pointer;
    border: 1px solid transparent; transition: all .15s; font-family: inherit; text-decoration: none;
  }
  .btn-primary { background: var(--blue-600); color: white; border-color: var(--blue-600); }
  .btn-primary:hover { background: var(--blue-700); }
  .btn-secondary { background: white; color: var(--gray-700); border-color: var(--gray-200); }
  .btn-secondary:hover { background: var(--gray-50); }
  .btn-danger { background: white; color: var(--red-500); border-color: var(--gray-200); }
  .btn-danger:hover { background: var(--red-50); border-color: var(--red-500); }
  .btn-sm { padding: 6px 10px; font-size: 12px; }

  /* ===== Layout ===== */
  .app-layout { display: flex; min-height: 100vh; }

  /* ===== Sidebar ===== */
  .sidebar {
    width: 260px; flex-shrink: 0; background: white; border-right: 1px solid var(--gray-200);
    display: flex; flex-direction: column; position: sticky; top: 0; height: 100vh; z-index: 50;
  }
  .sidebar-header {
    padding: 20px; display: flex; align-items: center; gap: 12px; border-bottom: 1px solid var(--gray-100);
  }
  .sidebar-logo {
    width: 40px; height: 40px; border-radius: 10px; flex-shrink: 0;
    background: linear-gradient(135deg, #ea580c, #c2410c); color: white;
    font-weight: 800; font-size: 16px; display: flex; align-items: center; justify-content: center;
  }
  .sidebar-logo-text { font-weight: 800; font-size: 15px; color: var(--gray-900); line-height: 1.2; }
  .sidebar-logo-text small { display: block; font-size: 10px; font-weight: 500; color: var(--gray-400); }
  .sidebar-nav { flex: 1; overflow-y: auto; padding: 12px; }
  .nav-section-label {
    font-size: 11px; font-weight: 700; color: var(--gray-400); text-transform: uppercase;
    letter-spacing: 0.5px; padding: 12px 12px 6px;
  }
  .nav-item {
    display: flex; align-items: center; gap: 10px; padding: 10px 12px; border-radius: 10px;
    font-size: 14px; font-weight: 500; color: var(--gray-600); text-decoration: none;
    margin-bottom: 2px; transition: all .12s;
  }
  .nav-item:hover { background: var(--gray-50); color: var(--gray-800); }
  .nav-item.active { background: var(--blue-50); color: var(--blue-700); font-weight: 600; }
  .nav-icon { font-size: 18px; width: 24px; text-align: center; }
  .nav-badge {
    margin-left: auto; background: var(--blue-600); color: white; font-size: 11px;
    font-weight: 700; padding: 2px 8px; border-radius: 99px; min-width: 20px; text-align: center;
  }
  .sidebar-footer { padding: 12px; border-top: 1px solid var(--gray-100); }
  .sidebar-user { display: flex; align-items: center; gap: 10px; padding: 8px; }
  .sidebar-avatar {
    width: 36px; height: 36px; border-radius: 50%; flex-shrink: 0;
    background: var(--gray-300); color: white; font-weight: 700; font-size: 13px;
    display: flex; align-items: center; justify-content: center;
  }
  .sidebar-user-info { flex: 1; min-width: 0; }
  .sidebar-user-info .name { font-size: 13px; font-weight: 600; color: var(--gray-800); }
  .sidebar-user-info .role { font-size: 11px; color: var(--gray-400); }
  .logout-btn {
    background: none; border: none; color: var(--gray-400); cursor: pointer;
    padding: 6px; border-radius: 8px; display: flex; align-items: center;
  }
  .logout-btn:hover { background: var(--gray-100); color: var(--gray-600); }

  /* ===== Main Area ===== */
  .main-area { flex: 1; display: flex; flex-direction: column; min-width: 0; }
  .topbar {
    display: flex; align-items: center; gap: 16px; padding: 16px 24px;
    background: white; border-bottom: 1px solid var(--gray-200); position: sticky; top: 0; z-index: 40;
  }
  .topbar-title { font-size: 18px; font-weight: 700; color: var(--gray-900); }
  .topbar-subtitle { font-size: 13px; color: var(--gray-400); }
  .topbar-spacer { flex: 1; }
  .topbar-actions { display: flex; align-items: center; gap: 12px; }
  .live-badge {
    display: flex; align-items: center; gap: 6px; padding: 6px 12px; border-radius: 99px;
    background: var(--green-50); color: var(--green-600); border: 1px solid var(--green-500);
    font-size: 12px; font-weight: 700;
  }
  .live-dot {
    width: 8px; height: 8px; border-radius: 50%; background: var(--green-500);
    animation: pulse 1.5s infinite;
  }
  @keyframes pulse { 0%,100% { opacity: 1; } 50% { opacity: 0.3; } }
  .mobile-menu-btn { display: none; background: none; border: none; cursor: pointer; color: var(--gray-600); padding: 4px; }

  /* ===== Content ===== */
  .content { padding: 24px; flex: 1; max-width: 1400px; width: 100%; }

  /* ===== Grids ===== */
  .grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; }
  .grid-3 { display: grid; grid-template-columns: repeat(3, 1fr); gap: 20px; }
  .grid-4 { display: grid; grid-template-columns: repeat(4, 1fr); gap: 20px; }

  /* ===== Cards ===== */
  .card {
    background: white; border-radius: 16px; padding: 20px;
    border: 1px solid var(--gray-200);
  }
  .card-title { font-size: 15px; font-weight: 700; color: var(--gray-900); margin-bottom: 2px; }
  .card-subtitle { font-size: 13px; color: var(--gray-400); margin-bottom: 16px; }

  .stat-card {
    background: white; border-radius: 16px; padding: 20px;
    border: 1px solid var(--gray-200);
  }
  .stat-icon {
    width: 44px; height: 44px; border-radius: 12px; display: flex;
    align-items: center; justify-content: center; font-size: 22px; margin-bottom: 12px;
  }
  .stat-label { font-size: 13px; color: var(--gray-400); font-weight: 500; }
  .stat-value { font-size: 28px; font-weight: 800; color: var(--gray-900); margin-top: 2px; }

  /* ===== Tables ===== */
  .filter-row { display: flex; gap: 12px; align-items: center; margin-bottom: 20px; flex-wrap: wrap; }
  .filter-row .spacer { flex: 1; }
  .search-input { max-width: 280px; }
  .visits-table-wrapper { overflow-x: auto; border-radius: 12px; border: 1px solid var(--gray-200); }
  .table { width: 100%; border-collapse: collapse; font-size: 14px; }
  .table th {
    text-align: left; padding: 12px 16px; font-size: 12px; font-weight: 700;
    color: var(--gray-500); text-transform: uppercase; letter-spacing: 0.5px;
    background: var(--gray-50); border-bottom: 1px solid var(--gray-200); white-space: nowrap;
  }
  .table td { padding: 14px 16px; border-bottom: 1px solid var(--gray-100); color: var(--gray-700); }
  .table tbody tr:hover { background: var(--gray-50); }
  .table tbody tr:last-child td { border-bottom: none; }

  /* ===== Avatars ===== */
  .avatar {
    width: 36px; height: 36px; border-radius: 50%; flex-shrink: 0;
    color: white; font-weight: 700; font-size: 13px;
    display: flex; align-items: center; justify-content: center;
  }
  .avatar-lg { width: 72px; height: 72px; font-size: 24px; }

  /* ===== Progress Bar ===== */
  .progress-bar { width: 100%; height: 6px; background: var(--gray-100); border-radius: 99px; overflow: hidden; }
  .progress-fill { height: 100%; background: var(--blue-600); border-radius: 99px; transition: width .3s; }

  /* ===== Tailwind-style utility classes used by statusBadge/roleBadge ===== */
  .bg-gray-100 { background: var(--gray-100); } .text-gray-500 { color: var(--gray-500); } .text-gray-600 { color: var(--gray-600); } .border-gray-200 { border-color: var(--gray-200); }
  .bg-emerald-100 { background: var(--emerald-100); } .text-emerald-700 { color: var(--emerald-700); } .border-emerald-200 { border-color: #a7f3d0; }
  .bg-amber-100 { background: var(--amber-100); } .text-amber-700 { color: var(--amber-700); } .border-amber-200 { border-color: #fde68a; }
  .bg-red-100 { background: var(--red-100); } .text-red-700 { color: var(--red-700); } .border-red-200 { border-color: #fecaca; }
  .bg-blue-100 { background: #ffedd5; } .text-blue-700 { color: #c2410c; } .border-blue-200 { border-color: #fed7aa; }
  .bg-blue-50 { background: var(--blue-50); } .text-blue-700 { color: var(--blue-700); }
  .bg-purple-50 { background: var(--purple-50); } .text-purple-700 { color: var(--purple-700); }
  .bg-emerald-50 { background: var(--green-50); }
  .px-2\.5 { padding: 0 0.625rem; } .py-0\.5 { padding: 0.125rem 0; } .px-2 { padding: 0 0.5rem; }
  .text-xs { font-size: 12px; } .font-medium { font-weight: 500; }

  /* ===== Badges ===== */
  .inline-flex { display: inline-flex; align-items: center; }
  .rounded-full { border-radius: 99px; }
  .items-center { align-items: center; }

  /* ===== Detail Grid ===== */
  .detail-grid { display: grid; grid-template-columns: auto 1fr; gap: 12px 16px; margin-top: 16px; }
  .detail-label { font-size: 13px; color: var(--gray-400); font-weight: 500; }
  .detail-value { font-size: 14px; color: var(--gray-800); font-weight: 500; }
  .detail-value.full { grid-column: 2; }

  /* ===== Empty State ===== */
  .empty-state { text-align: center; padding: 48px 20px; }
  .empty-icon { font-size: 48px; margin-bottom: 12px; }
  .empty-state h3 { font-size: 16px; font-weight: 700; color: var(--gray-700); margin: 0 0 4px; }
  .empty-state p { font-size: 13px; color: var(--gray-400); margin: 0; }

  /* ===== Map ===== */
  .map-container { display: flex; gap: 0; border-radius: 16px; overflow: hidden; border: 1px solid var(--gray-200); }
  #trackingMap { flex: 1; height: 520px; min-height: 400px; background: var(--gray-100); }
  .map-sidebar-panel {
    width: 300px; flex-shrink: 0; background: white; padding: 16px;
    overflow-y: auto; max-height: 520px; border-left: 1px solid var(--gray-200);
  }
  .map-sidebar-panel h3 { font-size: 14px; font-weight: 700; color: var(--gray-800); margin: 0 0 12px; }
  .map-emp-item {
    display: flex; align-items: center; gap: 10px; padding: 10px; border-radius: 10px;
    cursor: pointer; transition: background .12s; margin-bottom: 4px;
  }
  .map-emp-item:hover { background: var(--gray-50); }
  .map-emp-item.selected { background: var(--blue-50); }
  .emp-status-dot { width: 10px; height: 10px; border-radius: 50%; flex-shrink: 0; }
  .emp-info { flex: 1; min-width: 0; }
  .emp-name { font-size: 14px; font-weight: 600; color: var(--gray-800); }
  .emp-area { font-size: 12px; color: var(--gray-400); }

  /* ===== Modal ===== */
  .modal-overlay {
    position: fixed; inset: 0; background: rgba(0,0,0,0.5); z-index: 100;
    display: flex; align-items: flex-start; justify-content: center; padding: 40px 20px;
    overflow-y: auto;
  }
  .modal {
    background: white; border-radius: 16px; padding: 24px; max-width: 560px; width: 100%;
    box-shadow: 0 20px 60px rgba(0,0,0,0.3); margin: auto;
  }
  .modal-title { font-size: 18px; font-weight: 700; color: var(--gray-900); margin-bottom: 20px; }
  .modal-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; }
  .modal-header h2 { font-size: 18px; font-weight: 700; color: var(--gray-900); margin: 0; }
  .modal-close { background: none; border: none; font-size: 20px; color: var(--gray-400); cursor: pointer; padding: 4px 8px; border-radius: 8px; }
  .modal-close:hover { background: var(--gray-100); color: var(--gray-600); }
  .modal-body { max-height: 65vh; overflow-y: auto; }
  .modal-footer { display: flex; gap: 8px; justify-content: flex-end; padding-top: 20px; }

  /* ===== Toast ===== */
  #toastRoot { position: fixed; top: 20px; right: 20px; z-index: 200; display: flex; flex-direction: column; gap: 8px; }
  .toast {
    background: var(--gray-800); color: white; padding: 12px 20px; border-radius: 12px;
    font-size: 14px; font-weight: 500; box-shadow: 0 8px 24px rgba(0,0,0,0.2);
    transition: opacity .3s, transform .3s; max-width: 360px;
  }
  .toast.success { background: var(--green-600); }

  /* ===== Mobile Sim ===== */
  .mobile-sim-page { display: flex; gap: 24px; padding: 24px; align-items: flex-start; flex-wrap: wrap; }
  .phone-frame {
    width: 390px; max-width: 100%; height: 780px; background: var(--gray-900); border-radius: 44px;
    padding: 12px; box-shadow: 0 20px 60px rgba(0,0,0,0.3); flex-shrink: 0;
  }
  .phone-screen {
    width: 100%; height: 100%; background: var(--gray-50); border-radius: 32px;
    overflow: hidden; display: flex; flex-direction: column; position: relative;
  }
  .phone-status-bar {
    display: flex; justify-content: space-between; align-items: center; padding: 8px 20px;
    font-size: 13px; font-weight: 600; color: var(--gray-900); background: white;
    border-bottom: 1px solid var(--gray-100);
  }
  .mobile-header {
    display: flex; align-items: center; gap: 12px; padding: 16px;
    background: linear-gradient(135deg, #ea580c, #c2410c); color: white;
  }
  .mobile-header .avatar { background: rgba(255,255,255,0.2); }
  .mobile-header .greeting { font-size: 13px; opacity: 0.8; }
  .mobile-header .name { font-size: 16px; font-weight: 700; }
  .mobile-tabs { display: flex; background: white; border-bottom: 1px solid var(--gray-100); }
  .mobile-tab {
    flex: 1; padding: 12px; text-align: center; font-size: 13px; font-weight: 600;
    color: var(--gray-400); cursor: pointer; border-bottom: 2px solid transparent;
  }
  .mobile-tab.active { color: var(--blue-600); border-bottom-color: var(--blue-600); }
  .mobile-content { flex: 1; overflow-y: auto; padding: 16px; }
  .mobile-card {
    background: white; border-radius: 14px; padding: 16px; margin-bottom: 12px;
    border: 1px solid var(--gray-200);
  }
  .mobile-card-title { font-size: 13px; color: var(--gray-400); font-weight: 500; }
  .mobile-card-value { font-size: 22px; font-weight: 800; color: var(--gray-900); margin-top: 4px; }
  .mobile-visit-item {
    display: flex; align-items: center; gap: 10px; padding: 12px; border-radius: 12px;
    background: white; border: 1px solid var(--gray-200); margin-bottom: 8px;
  }
  .mobile-checkin-btn {
    width: 100%; padding: 14px; background: var(--blue-600); color: white; border: none;
    border-radius: 12px; font-size: 15px; font-weight: 700; cursor: pointer; margin-top: 8px;
  }
  .mobile-checkin-btn:disabled { background: var(--green-500); }
  .mobile-info-panel { flex: 1; min-width: 300px; max-width: 400px; }

  /* ===== Mobile Sim (phone mockup) ===== */
  .mobile-sim-frame {
    width: 390px; max-width: 100%; height: 780px; background: var(--gray-900);
    border-radius: 44px; padding: 12px; box-shadow: 0 20px 60px rgba(0,0,0,0.3);
    margin: 0 auto; display: flex; flex-direction: column;
  }
  .mobile-sim-screen {
    flex: 1; background: var(--gray-50); border-radius: 32px; overflow: hidden;
    display: flex; flex-direction: column; position: relative;
  }
  .mobile-sim-header {
    display: flex; justify-content: space-between; align-items: center;
    padding: 16px 20px; background: linear-gradient(135deg, #ea580c, #c2410c); color: white;
  }
  .mobile-sim-header h2 { font-size: 18px; font-weight: 700; margin: 0; }
  .mobile-sim-body { flex: 1; overflow-y: auto; padding: 16px; }
  .mobile-section-title { font-size: 14px; font-weight: 700; color: var(--gray-800); margin: 16px 0 8px; }
  .mobile-info-row { display: flex; justify-content: space-between; padding: 8px 0; border-bottom: 1px solid var(--gray-100); font-size: 13px; }
  .mobile-info-row .label { color: var(--gray-400); font-weight: 500; }
  .mobile-info-row .value { color: var(--gray-800); font-weight: 600; }
  .mobile-bottom-nav { display: flex; background: white; border-top: 1px solid var(--gray-200); padding: 4px; }
  .mobile-nav-item {
    flex: 1; display: flex; flex-direction: column; align-items: center; gap: 2px;
    padding: 8px 4px; font-size: 11px; font-weight: 600; color: var(--gray-400);
    background: none; border: none; cursor: pointer; font-family: inherit;
  }
  .mobile-nav-item.active { color: var(--blue-600); }
  .mobile-nav-icon { font-size: 20px; }

  /* ===== Responsive ===== */
  @media (max-width: 1024px) {
    .grid-4 { grid-template-columns: repeat(2, 1fr); }
    .grid-3 { grid-template-columns: 1fr; }
    .grid-2 { grid-template-columns: 1fr; }
  }
  @media (max-width: 768px) {
    .sidebar {
      position: fixed; left: 0; top: 0; transform: translateX(-100%); transition: transform .25s;
    }
    .sidebar.open { transform: translateX(0); box-shadow: 4px 0 20px rgba(0,0,0,0.15); }
    .mobile-menu-btn { display: flex; }
    .grid-4 { grid-template-columns: 1fr; }
    .content { padding: 16px; }
    .map-sidebar-panel { display: none; }
  }
</style>

<div id="app"></div>
<div id="modalRoot"></div>
<div id="toastRoot"></div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

  import './src/app.js';
